name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build visual assets
        run: npm run assets:build

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Resolve VSIX file
        id: vsix
        run: echo "path=$(ls -1 *.vsix | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: ${{ vars['PUBLISH_TO_MARKETPLACE'] == 'true' }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT is empty. Skipping marketplace publish."
            exit 0
          fi

          npx @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.path }}"
        env:
          VSCE_PAT: ${{ secrets['VSCE_PAT'] }}
