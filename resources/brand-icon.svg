<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Intelli Explorer Brand Icon</title>
  <desc id="desc">Rounded gradient square with a folder and compass symbol.</desc>
